<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pebble Apps — Legal & Compliance</title>
  <style>
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #555555;
      --accent: #2563eb;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 3rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 580px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    a.btn {
      display: block;
      padding: 0.85rem 1.25rem;
      background: var(--bg);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.15s ease;
    }
    a.btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pebble Apps</h1>
    <p>Centro Legal y de Cumplimiento / Legal &amp; Compliance Portal</p>
    <div class="links">
      <a class="btn" href="privacy-policy.html">Política de Privacidad / Privacy Policy</a>
      <a class="btn" href="terms.html">Términos de Servicio / Terms of Service</a>
      <a class="btn" href="delete-account.html">Eliminación de Cuenta / Delete Account</a>
    </div>
    <div class="footer">
      &copy; 2026 Pebble Apps &bull; <a href="mailto:edwin.amador7@gmail.com" style="color: inherit;">edwin.amador7@gmail.com</a>
    </div>
  </div>
</body>
</html>
